
name: Build Xiaozhi AI Eye ESP32-S3

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        run: |
          mkdir -p source
          unzip -q xiaozhi-ai-eye-oled-cloud-build.zip -d source
          test -f source/xiaozhi-esp32-2.2.4-ssd1306-adapted/CMakeLists.txt

      - name: Build ESP32-S3 firmware
        working-directory: source/xiaozhi-esp32-2.2.4-ssd1306-adapted
        run: |
          idf.py set-target esp32s3
          idf.py build

      - name: Upload firmware build files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-ai-eye-firmware-build
          path: |
            source/xiaozhi-esp32-2.2.4-ssd1306-adapted/build/*.bin
            source/xiaozhi-esp32-2.2.4-ssd1306-adapted/build/flasher_args.json
            source/xiaozhi-esp32-2.2.4-ssd1306-adapted/build/flash_args
            source/xiaozhi-esp32-2.2.4-ssd1306-adapted/build/bootloader/
            source/xiaozhi-esp32-2.2.4-ssd1306-adapted/build/partition_table/
          if-no-files-found: error
